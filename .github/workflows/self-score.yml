name: self-score

# The TypeScript self-score campaign is not this binary. This workflow runs the Rust suite.
# A later ledger rescore is a separate decision.

on:
  push:
    branches: [main, next]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: self-score-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --offline
