name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: probatio
            asset: probatio-x86_64-unknown-linux-musl
            musl: true
          - os: macos-14
            target: aarch64-apple-darwin
            bin: probatio
            asset: probatio-aarch64-apple-darwin
            musl: false
          - os: macos-14
            target: x86_64-apple-darwin
            bin: probatio
            asset: probatio-x86_64-apple-darwin
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: probatio.exe
            asset: probatio-x86_64-pc-windows-msvc.exe
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Rust binaries for ${{ github.ref_name }}.
            `npm install probatio` installs the same binaries.
          files: |
            assets/probatio-x86_64-unknown-linux-musl
            assets/probatio-aarch64-apple-darwin
            assets/probatio-x86_64-apple-darwin
            assets/probatio-x86_64-pc-windows-msvc.exe
          fail_on_unmatched_files: true

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROBATIO_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set. Skipping npm publish."
            exit 0
          fi
          bash scripts/npm-publish.sh

  mcp-registry:
    needs: npm
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}
