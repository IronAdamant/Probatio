name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: probatio
            asset: probatio-x86_64-unknown-linux-musl
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: probatio
            asset: probatio-aarch64-apple-darwin
            musl: false
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: probatio
            asset: probatio-x86_64-apple-darwin
            musl: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: probatio.exe
            asset: probatio-x86_64-pc-windows-msvc.exe
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          # Hash the four release binaries only. SHA256SUMS is not an input, so it
          # is not listed in itself. Two spaces and a sorted name, the same layout
          # as the file attached to v0.9.0 by hand. This runs for a newly pushed
          # tag. It does not edit a release that already exists.
          bins=(
            probatio-aarch64-apple-darwin
            probatio-x86_64-apple-darwin
            probatio-x86_64-pc-windows-msvc.exe
            probatio-x86_64-unknown-linux-musl
          )
          shopt -s nullglob
          found=(probatio-*)
          if [[ ${#found[@]} -ne ${#bins[@]} ]]; then
            echo "expected ${#bins[@]} binaries, found ${#found[@]}" >&2
            ls -la >&2
            exit 1
          fi
          for bin in "${bins[@]}"; do
            if [[ ! -s "$bin" ]]; then
              echo "missing or empty binary: $bin" >&2
              exit 1
            fi
          done
          sha256sum -- "${bins[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if [[ "$(grep -cve '^$' SHA256SUMS)" -ne 4 ]]; then
            echo "SHA256SUMS should list 4 binaries" >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          if grep -q 'SHA256SUMS' SHA256SUMS; then
            echo "SHA256SUMS must not list itself" >&2
            exit 1
          fi
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Rust binaries for ${{ github.ref_name }}.
            Check them against `SHA256SUMS` before you run one.
            `npm install probatio` installs the same binaries.
          files: |
            assets/probatio-x86_64-unknown-linux-musl
            assets/probatio-aarch64-apple-darwin
            assets/probatio-x86_64-apple-darwin
            assets/probatio-x86_64-pc-windows-msvc.exe
            assets/SHA256SUMS
          fail_on_unmatched_files: true

  npm:
    needs: build
    # Set the repository variable NPM_PUBLISH to "false" to cut a tag and a
    # GitHub release without publishing to npm. The "npm publish" workflow
    # can publish that tag later.
    if: vars.NPM_PUBLISH != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROBATIO_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set. Skipping npm publish."
            exit 0
          fi
          bash scripts/npm-publish.sh

  mcp-registry:
    needs: npm
    # Publishing the listing is opt-in: set the repository variable
    # MCP_REGISTRY_PUBLISH to "true" to publish on every tag. The
    # "mcp registry" workflow can always be run by hand for a tag.
    if: vars.MCP_REGISTRY_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}
