name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --offline
      - run: cargo clippy --offline --all-targets

  npm-launcher:
    name: npm launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server.json
        run: node scripts/validate-server-json.js
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the musl release binary
        run: cargo build --release --offline --target x86_64-unknown-linux-musl
      - name: Pack, install, and run probatio --version
        env:
          PROBATIO_BIN: target/x86_64-unknown-linux-musl/release/probatio
        run: bash scripts/npm-pack-local.sh --smoke
      - name: Resolve the scoped Windows package
        run: node scripts/npm-launcher-win32.js
