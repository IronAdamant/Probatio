[package]
name = "probatio"
version = "0.7.1"
edition = "2021"
description = "Mutation runner. Scores a test suite by the bugs it catches."
license = "MIT"
publish = false

[lib]
name = "probatio"
path = "src/lib.rs"

[[bin]]
name = "probatio"
path = "src/main.rs"

[dependencies]

[dev-dependencies]

# Benchmark against the TypeScript CLI. Not shipped: `cargo run --release --example benchmark`.
[[example]]
name = "benchmark"
path = "scripts/benchmark.rs"
